# 唯一容器入口：基础设施及 Nginx 在 Docker，Java 在宿主机由脚本或 IDEA 运行。
name: stock-exchange-securities
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  nginx:
    <<: *runtime
    image: nginx:1.28.3-alpine
    container_name: nginx
    ports: ["127.0.0.1:${SEC_GATEWAY_PORT:-8080}:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql:
    <<: *runtime
    image: mysql:8.0.45
    container_name: mysql
    ports: ["127.0.0.1:${SEC_MYSQL_PORT:-13306}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SEC_MYSQL_ROOT_PASSWORD:?请填写 build/.env.securities}
      MYSQL_DATABASE: exchange_securities
      MYSQL_USER: securities
      MYSQL_PASSWORD: ${SEC_MYSQL_PASSWORD:?缺少数据库密码}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -usecurities exchange_securities -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    <<: *runtime
    image: redis:7.4.2-alpine
    container_name: redis
    ports: ["127.0.0.1:${SEC_REDIS_PORT:-16379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    <<: *runtime
    image: apache/kafka:3.9.0
    container_name: kafka
    ports: ["127.0.0.1:${SEC_KAFKA_PORT:-19092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${SEC_KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: U2VjdXJpdGllc0RldjAwMQ
    volumes: ["kafka-data:/var/lib/kafka/data", "./securities/init-topics.sh:/scripts/init-topics.sh:ro"]
    # 在同一容器内监督 broker 并初始化 Topic；失败退出，不以健康状态掩盖初始化失败。
    command:
      - /bin/bash
      - -ec
      - |
        rm -f /tmp/securities-topics-ready
        /etc/kafka/docker/run &
        broker=$$!
        trap 'kill -TERM "$$broker" 2>/dev/null || true' TERM INT EXIT
        ready=false
        for attempt in {1..90}; do
          kill -0 "$$broker" || exit 1
          if /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1; then ready=true; break; fi
          sleep 2
        done
        $$ready || exit 1
        /bin/bash /scripts/init-topics.sh
        touch /tmp/securities-topics-ready
        wait "$$broker"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/securities-topics-ready && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./runtime/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SEC_GRAFANA_PASSWORD:?缺少 Grafana 密码}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./runtime/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./runtime/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/securities.yml:ro
      - ./runtime/grafana/dashboards:/etc/grafana/securities-dashboards:ro
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
# 明确保留已有卷名，容器重命名不等于换数据库；可用环境变量为测试指定全新卷。
volumes:
  mysql-data: {name: "${SEC_MYSQL_VOLUME:-stock-exchange-securities_mysql-data}"}
  redis-data: {name: "${SEC_REDIS_VOLUME:-stock-exchange-securities_redis-data}"}
  kafka-data: {name: "${SEC_KAFKA_VOLUME:-stock-exchange-securities_kafka-data}"}
  prometheus-data: {name: "${SEC_PROMETHEUS_VOLUME:-stock-exchange-monitoring_prometheus-data}"}
  grafana-data: {name: "${SEC_GRAFANA_VOLUME:-stock-exchange-monitoring_grafana-data}"}
