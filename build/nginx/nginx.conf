# 证券统一入口：只代理 UI 与 Push，日志不记录查询参数、Cookie、票据或认证头。
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # 只升级 WebSocket，不把 Java 客户端探测使用的 h2c 升级透传给 Push。
    map $http_upgrade $connection_upgrade { ~*^websocket$ upgrade; default close; }
    map $http_upgrade $websocket_upgrade { ~*^websocket$ websocket; default ''; }
    log_format safe '$remote_addr $request_method $uri $status $request_time $upstream_response_time';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=login:1m rate=2r/s;
    # 行情通知会触发并发重拉；入口粗限流要允许同一 NAT 下的正常多页面突发。
    limit_req_zone $binary_remote_addr zone=public:1m rate=100r/s;
    limit_req_status 429;
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_http_version 1.1;
    # Docker Desktop 可同时返回 A/AAAA，但 Java 保持 IPv4 回环监听；仅解析可达的 IPv4。
    resolver 127.0.0.11 ipv6=off valid=10s;
    # 本机部署只有一个边缘代理，覆盖而非追加浏览器伪造的转发地址。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port '';
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded '';
    proxy_set_header Connection '';
    include /etc/nginx/conf.d/*.conf;
}
