# 本地开发网关：公共接口仍经过 UI 的 Session/CSRF/Bearer 转换，未知路径默认拒绝。
upstream securities_ui { zone ui 64k; server host.docker.internal:8100 resolve; keepalive 8; }
upstream securities_push { zone push 64k; server host.docker.internal:8106 resolve; }
server {
    listen 80 default_server;
    server_name _;
    return 421;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    # 此健康接口只代表 Nginx 自身存活，启动脚本另检查 UI 会话和 WebSocket。
    location = /gateway-health { access_log off; default_type text/plain; return 200 'ok\n'; }
    location = /ws {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://securities_push;
        # 本 location 的 proxy_set_header 不继承父层，必须完整列出可信头。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port '';
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded '';
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        # Nginx 错误日志可能包含原始请求行，不让一次性票据进入错误日志。
        error_log /dev/null;
    }
    location ~ ^/auth/(signin|signup|signout)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://securities_ui;
    }
    location ~ ^/($|signin$|signup$|session$|securities/|api/v1/) {
        limit_req zone=public burst=300 nodelay;
        proxy_pass http://securities_ui;
    }
    location / { return 404; }
}
