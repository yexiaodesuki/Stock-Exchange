# 配置中心本地配置：不向自身取配置，管理接口与业务接口分离。
server:
  port: ${CONFIG_PORT:8888}
  address: ${CONFIG_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:./config-repo,file:../config-repo,file:../../config-repo,file:../../../config-repo}

management:
  server:
    port: ${CONFIG_MANAGEMENT_PORT:18888}
    address: ${CONFIG_BIND_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: config-server
