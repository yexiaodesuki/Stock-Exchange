# 全证券公共配置；只包含非敏感参数，私密占位符只保留在客户端。
spring:
  # 显式迁移入口负责版本校验，禁用默认 Flyway 自动配置。
  flyway:
    enabled: false
  datasource:
    url: ${SECURITIES_JDBC_URL:jdbc:mysql://127.0.0.1:13306/exchange_securities?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=10000}
    username: securities
    hikari:
      maximum-pool-size: 8
server:
  address: ${SECURITIES_BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
management:
  server:
    address: ${SECURITIES_BIND_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
securities:
  config-contract: securities-v1
  namespace: ${SECURITIES_NAMESPACE:securities.v1}
  kafka-bootstrap: ${SEC_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
  redis-uri: ${SEC_REDIS_URI:redis://127.0.0.1:16379/0}
  engine-url: ${SECURITIES_ENGINE_URL:http://127.0.0.1:8102}
